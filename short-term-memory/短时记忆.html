<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>记忆训练</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#101828; --sub:#6b7280;
    --line:#e6e9f0; --cell:#f0f2f7; --brand:#2563eb; --brand-soft:#eaf1ff;
    --ok:#12b76a; --bad:#f04438; --shadow:0 1px 2px rgba(16,24,40,.05);
  }
  html[data-theme="dark"]{
    --bg:#0b111c; --panel:#151d2b; --ink:#e8ecf3; --sub:#8b98ab;
    --line:#242f42; --cell:#1b2536; --brand:#4b8bff; --brand-soft:#16233a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  main{flex:1; display:flex; flex-direction:column;}
  .view{display:none; flex:1; flex-direction:column; padding:22px 18px 96px;}
  .view.active{display:flex;}
  #v-play{padding:0;}

  /* ---------- 通用 ---------- */
  h1{font-size:21px; margin:0; letter-spacing:-.01em;}
  h2{font-size:17px; margin:0 0 4px; letter-spacing:-.01em;}
  .sub{color:var(--sub); font-size:12.5px; margin:4px 0 0; line-height:1.6;}
  .hd{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px;}
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:12px; padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer;
    font-family:inherit; transition:transform .06s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.985);}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.big{width:100%; padding:15px; font-size:15px; border-radius:14px;}
  .btn.ghost{background:transparent;}
  .icon{
    appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .pill{background:var(--brand-soft); color:var(--brand); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .tag{font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.04em;}

  /* ---------- 首页 ---------- */
  .hero{background:linear-gradient(160deg, var(--brand) 0%, #1e4fd8 100%); border:0; color:#fff; padding:18px;}
  .hero .tag{color:rgba(255,255,255,.72);}
  .hero h2{font-size:20px; margin:8px 0 4px;}
  .hero .sub{color:rgba(255,255,255,.78); margin-bottom:16px;}
  .hero .btn{background:#fff; color:#1e4fd8; border:0;}
  .hero-top{display:flex; align-items:center; justify-content:space-between;}
  .hero .lvtag{font-size:11.5px; font-weight:700; background:rgba(255,255,255,.18); padding:4px 9px; border-radius:999px;}

  .gcard{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .gicon{
    width:44px; height:44px; border-radius:13px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; color:var(--brand); background:var(--brand-soft);
  }
  .gcard .meta{flex:1; min-width:0;}
  .gcard .nm{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .gcard .dt{font-size:11.5px; color:var(--sub); margin-top:3px;}
  .arrow{color:var(--sub); font-size:16px;}
  .cal{display:flex; align-items:center; gap:12px; border-style:dashed;}

  /* ---------- 局内 ---------- */
  .hud{display:flex; align-items:center; gap:10px; padding:14px 14px 10px;}
  .hudmid{flex:1; display:flex; align-items:baseline; gap:8px; font-size:13px; font-weight:600;}
  .hudmid em{font-style:normal; color:var(--sub); font-weight:500; font-size:12px;}
  .hudline{height:3px; background:var(--cell); margin:0 14px; border-radius:2px; overflow:hidden;}
  .hudline i{display:block; height:100%; width:0; background:var(--brand); border-radius:2px; transition:width .25s ease;}
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:10px 18px 24px; text-align:center;}
  .hint{font-size:12.5px; color:var(--sub); letter-spacing:.02em;}
  .digit{font-size:clamp(60px,19vw,104px); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.03em;}
  .digitwrap{height:130px; display:flex; align-items:center; justify-content:center;}
  .dboxes{display:flex; gap:7px; justify-content:center; flex-wrap:wrap;}
  .dboxes i{
    width:29px; height:42px; border-bottom:2.5px solid var(--line); font-style:normal;
    font-size:22px; font-weight:700; display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; width:min(82vw,300px);}
  .keypad button{
    height:54px; border-radius:13px; border:1px solid var(--line); background:var(--panel);
    font-size:21px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .keypad button:active{background:var(--cell);}
  .keypad button.blank{border:0; background:transparent; pointer-events:none;}
  .keypad button.del{font-size:17px; color:var(--sub);}

  .gridbox{display:grid; gap:8px; width:min(80vw,320px); margin:0 auto;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g5{grid-template-columns:repeat(5,1fr);}
  .g6{grid-template-columns:repeat(6,1fr);}
  .cell{
    aspect-ratio:1; border-radius:11px; border:1px solid var(--line); background:var(--cell);
    cursor:pointer; padding:0; font-family:inherit; color:#fff; font-weight:700; font-size:18px;
    display:flex; align-items:center; justify-content:center; transition:background .09s ease;
  }
  .cell.lit{background:var(--brand); border-color:var(--brand); box-shadow:0 0 0 3px rgba(75,139,255,.16);}
  .cell.hit{background:var(--ok); border-color:var(--ok);}
  .cell.miss{background:var(--bad); border-color:var(--bad);}
  .cell.sel{background:var(--brand); border-color:var(--brand);}
  .row{display:flex; gap:10px; width:min(82vw,320px); margin:0 auto;}
  .row .btn{flex:1;}
  .row2{display:flex; gap:12px; width:min(88vw,360px);}
  .row2 .btn{flex:1; padding:18px 10px; font-size:16px;}

  .fb{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    font-size:64px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease;
  }
  .fb.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .fb.ok{color:var(--ok);}
  .fb.bad{color:var(--bad);}

  /* ---------- 结算 ---------- */
  .res{flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; text-align:center;}
  .score{font-size:64px; font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums;}
  .res .cap{font-size:12.5px; color:var(--sub); letter-spacing:.06em;}
  .stats3{display:flex; gap:10px;}
  .stats3 div{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 8px;}
  .stats3 b{display:block; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stats3 span{font-size:11px; color:var(--sub);}
  .strip{display:flex; gap:4px; justify-content:center; flex-wrap:wrap;}
  .strip i{width:16px; height:16px; border-radius:5px; background:var(--cell);}
  .strip i.ok{background:var(--ok);}
  .strip i.bad{background:var(--bad);}
  .up{color:var(--ok);}
  .down{color:var(--sub);}

  /* ---------- 数据 ---------- */
  .bars{display:flex; flex-direction:column; gap:12px;}
  .bar{display:flex; align-items:center; gap:10px; font-size:12px;}
  .bar span{width:34px; color:var(--sub);}
  .bar .track{flex:1; height:8px; background:var(--cell); border-radius:5px; overflow:hidden;}
  .bar .track i{display:block; height:100%; border-radius:5px; background:var(--brand);}
  .bar b{width:22px; text-align:right; font-variant-numeric:tabular-nums;}
  .chart{width:100%; height:auto; display:block;}
  .chart text{font-size:9px; fill:var(--sub);}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;}
  .legend span{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--sub);}
  .legend i{width:8px; height:8px; border-radius:50%;}
  .empty{color:var(--sub); font-size:12.5px; text-align:center; padding:26px 0;}
  .srow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:12.5px; cursor:pointer;}
  .srow:last-child{border-bottom:0;}
  .srow .d{color:var(--sub); width:44px; flex:none; font-variant-numeric:tabular-nums;}
  .srow .n{flex:1; font-weight:600;}
  .srow .v{font-variant-numeric:tabular-nums;}
  .detail{padding:8px 0 12px;}

  /* ---------- 设置 ---------- */
  .list{padding:4px 16px;}
  .list .row{display:flex; align-items:center; justify-content:space-between; gap:12px; width:auto; margin:0; padding:14px 0; border-bottom:1px solid var(--line); background:none; border-radius:0; text-align:left; cursor:default;}
  .list button.row{appearance:none; border:0; border-bottom:1px solid var(--line); background:none; font-family:inherit; color:var(--ink);}
  .list .row:last-child{border-bottom:0;}
  .list .row.tap{cursor:pointer; width:100%; font-family:inherit;}
  .list b{font-size:13.5px; font-weight:600; display:block;}
  .list span{font-size:11.5px; color:var(--sub); display:block; margin-top:3px;}
  .list i{font-style:normal; color:var(--sub);}
  .list .row.danger b{color:var(--bad);}
  .seg{display:flex; gap:5px;}
  .seg button{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:none;
    color:var(--sub); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
    white-space:nowrap; padding:0;
  }
  .seg button.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .seg.wide button{width:auto; min-width:34px; padding:0 8px;}
  .switch{width:44px; height:26px; border-radius:14px; border:0; background:var(--cell); position:relative; cursor:pointer; flex:none;}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .16s ease; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch.on{background:var(--brand);}
  .switch.on::after{transform:translateX(18px);}
  .foot{text-align:center; color:var(--sub); font-size:11.5px; margin:18px 0 0;}

  /* ---------- Tab ---------- */
  #tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
    display:flex; background:var(--panel); border-top:1px solid var(--line);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom)); z-index:20;
  }
  #tabbar button{
    flex:1; border:0; background:none; color:var(--sub); font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; padding:4px 0; cursor:pointer;
  }
  #tabbar button.on{color:var(--brand);}
  #tabbar b{font-size:19px; font-weight:400; line-height:1;}
</style>
</head>
<body>
<div class="app">
  <main>
    <section id="v-home" class="view active"></section>
    <section id="v-play" class="view">
      <div class="hud">
        <button class="icon" id="btnQuit">✕</button>
        <div class="hudmid"><span id="hudName">训练</span><em id="hudProg">0/12</em></div>
        <span class="pill" id="hudLv">等级 2</span>
      </div>
      <div class="hudline"><i id="hudBar"></i></div>
      <div class="stage" id="stage"></div>
      <div class="fb" id="fb"></div>
    </section>
    <section id="v-result" class="view"></section>
    <section id="v-stats" class="view"></section>
    <section id="v-settings" class="view"></section>
  </main>
  <nav id="tabbar">
    <button data-tab="home" class="on"><b>▤</b>训练</button>
    <button data-tab="stats"><b>◔</b>数据</button>
    <button data-tab="settings"><b>⚙</b>设置</button>
  </nav>
</div>

<script>
/* =========================================================
   记忆训练 · 单文件版
   数据全部存在 localStorage，无任何网络请求
   ========================================================= */

/* ---------- 0. 工具 ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ABORT = { abort: true };

function ymd(d = new Date()){
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function median(arr){
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}
function pickUnique(total, n){
  const pool = Array.from({ length: total }, (_, i) => i);
  for (let i = pool.length - 1; i > 0; i--){
    const j = rnd(i + 1); [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

/* ---------- 1. 存储 ---------- */
const KEY = 'stm.v2';
const DB_DEFAULT = {
  version: 2,
  profile: { createdAt: ymd(), dailyGoal: 3, sound: true, theme: 'light', lock: false },
  calibration: null,
  sessions: [],
  streak: { current: 0, longest: 0, lastDate: null }
};
let DB = loadDB();

function loadDB(){
  const base = JSON.parse(JSON.stringify(DB_DEFAULT));
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return base;
    const d = JSON.parse(raw);
    return {
      version: 2,
      profile: Object.assign(base.profile, d.profile || {}),
      calibration: d.calibration || null,
      sessions: Array.isArray(d.sessions) ? d.sessions : [],
      streak: Object.assign(base.streak, d.streak || {})
    };
  } catch (e){ return base; }
}
function saveDB(){
  try {
    prune();
    localStorage.setItem(KEY, JSON.stringify(DB));
  } catch (e){
    // 容量满了 → 丢掉最老的一半
    DB.sessions = DB.sessions.slice(-Math.floor(DB.sessions.length / 2));
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (_){}
  }
}
function prune(){
  // 超过 90 天的记录只保留汇总，丢掉逐题明细
  const cut = Date.now() - 90 * 864e5;
  DB.sessions.forEach(s => {
    if (s.ts < cut && s.trials && s.trials.length > 6) s.trials = s.trials.slice(0, 4);
  });
}

/* ---------- 2. 音效（Web Audio 现场合成，无外部文件） ---------- */
let actx = null;
function beep(freq, dur = .07, type = 'sine'){
  if (!DB.profile.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.14, actx.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  } catch (e){}
}

/* ---------- 3. 视图路由 ---------- */
let view = 'home';
const ui = { range: 7 };

function go(v){
  view = v;
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'v-' + v));
  $('#tabbar').style.display = (v === 'play') ? 'none' : 'flex';
  $$('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === v));
  window.scrollTo(0, 0);
  if (v === 'home') renderHome();
  if (v === 'stats') renderStats();
  if (v === 'settings') renderSettings();
}
$$('#tabbar button').forEach(b => b.onclick = () => { if (S.cur) return; go(b.dataset.tab); });

/* ---------- 4. 首页 ---------- */
function todayCount(){
  const t = ymd();
  return DB.sessions.filter(s => ymd(new Date(s.ts)) === t).length;
}
function latestLevel(gameId){
  const ss = DB.sessions.filter(s => s.game === gameId);
  return ss.length ? ss[ss.length - 1].levelEnd : null;
}
function startLevelFor(gameId){
  const ss = DB.sessions.filter(s => s.game === gameId).slice(-3);
  if (!ss.length) return 2;
  return clamp(median(ss.map(s => s.levelEnd)), 1, 20);
}
function recommendGame(){
  // 近 7 天最少练的；一样多就挑等级最低的
  const from = Date.now() - 7 * 864e5;
  const score = {};
  Object.keys(GAMES).forEach(id => {
    score[id] = DB.sessions.filter(s => s.game === id && s.ts >= from).length * 100
             + (startLevelFor(id) || 2);
  });
  return Object.keys(GAMES).sort((a, b) => score[a] - score[b])[0];
}
function renderHome(){
  const goal = DB.profile.dailyGoal, cnt = todayCount();
  const rec = recommendGame();
  const g = GAMES[rec];
  const lv = startLevelFor(rec);
  const done = cnt >= goal;

  $('#v-home').innerHTML = `
    <div class="hd">
      <div>
        <h1>记忆训练</h1>
        <p class="sub">连续 ${DB.streak.current} 天 · 今日 ${cnt}/${goal} 局${done ? ' ✓' : ''}</p>
      </div>
      <button class="icon" id="btnTheme" title="切换主题">${DB.profile.theme === 'dark' ? '☀' : '☾'}</button>
    </div>

    <div class="card hero">
      <div class="hero-top">
        <span class="tag">${done ? '今日已完成' : '今日推荐'}</span>
        <span class="lvtag">等级 ${lv}</span>
      </div>
      <h2>${g.name}</h2>
      <p class="sub">${g.total} 题 · ${g.fmt(lv)} · 约 2 分钟</p>
      <button class="btn big" id="btnStart">${done ? '再练一局' : '开始训练'}</button>
    </div>

    ${!DB.sessions.length ? `
    <div class="card cal">
      <div class="gicon">◎</div>
      <div class="meta">
        <div class="nm">还没有基线数据</div>
        <div class="dt">4 个游戏各练 6 题，约 3 分钟，之后难度会贴着你的水平走</div>
      </div>
      <button class="btn" id="btnCal">校准</button>
    </div>` : ''}

    ${Object.values(GAMES).map(x => {
      const l = latestLevel(x.id);
      const best = DB.sessions.filter(s => s.game === x.id).reduce((m, s) => Math.max(m, s.score), 0);
      return `
      <div class="card gcard" data-game="${x.id}">
        <div class="gicon">${x.icon}</div>
        <div class="meta">
          <div class="nm">${x.name}<span class="tag">${x.dimName}</span></div>
          <div class="dt">${l ? `等级 ${l} · 最佳 ${best} 分` : '还没练过'}</div>
        </div>
        <span class="arrow">›</span>
      </div>`;
    }).join('')}
  `;

  $('#btnTheme').onclick = () => {
    DB.profile.theme = DB.profile.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = DB.profile.theme;
    saveDB(); renderHome();
  };
  $('#btnStart').onclick = () => startSession(rec);
  if ($('#btnCal')) $('#btnCal').onclick = startCalibration;
  $$('#v-home .gcard').forEach(el => {
    el.onclick = () => startSession(el.dataset.game);
  });
}

/* ---------- 5. 局内引擎 ---------- */
const S = { cur: null, quit: false, abort: null };

function renderHud(){
  if (!S.cur) return;
  $('#hudName').textContent = GAMES[S.cur.gameId].name;
  $('#hudLv').textContent = '等级 ' + S.cur.level;
  $('#hudProg').textContent = S.cur.idx + '/' + S.cur.total;
  $('#hudBar').style.width = (S.cur.idx / S.cur.total * 100) + '%';
}

async function startSession(gameId, opts = {}){
  const g = GAMES[gameId];
  S.quit = false; S.abort = null;
  S.runId = (S.runId || 0) + 1;
  const rid = S.runId;
  const total = opts.total || g.total;
  const start = opts.level || startLevelFor(gameId);
  S.cur = {
    gameId, level: start, start, idx: 0, total,
    trials: [], score: 0, combo: 0, up: 0, cal: !!opts.cal, nb: null
  };
  $('#fb').className = 'fb';
  $('#stage').innerHTML = '';
  go('play');
  renderHud();
  await runLoop(rid);
}

async function runLoop(rid){
  const g = GAMES[S.cur.gameId];
  try {
    while (S.cur && S.cur.idx < S.cur.total){
      if (S.runId !== rid || S.quit) return;
      const lv = S.cur.level;
      const r = await g.play(lv);
      if (S.runId !== rid || S.quit || !S.cur) return;

      const ok = !!r.ok;
      S.cur.combo = ok ? S.cur.combo + 1 : 0;
      const mult = (ok && S.cur.combo >= 3) ? 1.2 : 1;
      const pts = ok ? Math.round(10 * (1 + 0.1 * lv) * mult) : 0;
      S.cur.score += pts;
      S.cur.trials.push({ i: S.cur.idx, lv, ok: ok ? 1 : 0, rt: Math.round(r.rt || 0) });
      S.cur.idx++;

      if (ok){
        S.cur.up++;
        if (S.cur.up >= 2 && S.cur.level < 20 && (S.cur.level - S.cur.start) < 3){
          S.cur.level++; S.cur.up = 0;
        }
      } else {
        S.cur.level = Math.max(1, S.cur.level - 1);
        S.cur.up = 0;
      }

      await feedback(ok);
      if (S.runId !== rid || S.quit || !S.cur) return;
      renderHud();
    }
    if (S.runId === rid && S.cur && S.cur.idx >= S.cur.total) finishSession();
  } catch (e){
    if (e === ABORT || (e && e.abort)) return;
    console.error(e);
  }
}

function feedback(ok){
  const el = $('#fb');
  el.className = 'fb show ' + (ok ? 'ok' : 'bad');
  el.textContent = ok ? '✓' : '✗';
  beep(ok ? 940 : 200, .07, ok ? 'sine' : 'square');
  return sleep(520).then(() => { el.className = 'fb'; });
}

function quitPlay(){
  if (!S.cur) { go('home'); return; }
  if (!confirm('退出后本局成绩不会保存，确定？')) return;
  S.quit = true;
  if (S.abort) { try { S.abort(); } catch (e){} }
  S.cur = null;
  go('home');
}
$('#btnQuit').onclick = quitPlay;

function finishSession(){
  const c = S.cur;
  const n = c.trials.length;
  const okN = c.trials.filter(t => t.ok).length;
  const acc = n ? okN / n : 0;
  const rts = c.trials.map(t => t.rt).filter(x => x > 0 && x < 30000);
  const sess = {
    id: 's' + Date.now(),
    game: c.gameId,
    ts: Date.now(),
    levelStart: c.start,
    levelEnd: c.level,
    score: c.score,
    acc: +acc.toFixed(3),
    rtMed: Math.round(median(rts)),
    cal: !!c.cal,
    trials: c.trials
  };
  DB.sessions.push(sess);
  updateStreak();
  if (c.cal){
    DB.calibration = DB.calibration || {};
    DB.calibration[c.gameId] = c.level;
    DB.calibration.date = ymd();
  }
  saveDB();
  showResult(sess, c.cal);
}

function updateStreak(){
  const t = ymd(), y = ymd(new Date(Date.now() - 864e5)), s = DB.streak;
  if (s.lastDate === t) return;
  s.current = (s.lastDate === y) ? s.current + 1 : 1;
  s.longest = Math.max(s.longest, s.current);
  s.lastDate = t;
}

/* ---------- 6. 四个游戏 ---------- */
const GAMES = {};

/* 6.1 数字广度 */
GAMES.digits = {
  id: 'digits', name: '数字广度', dim: 'verbal', dimName: '言语', icon: '123',
  total: 12,
  fmt: l => `${clamp(2 + l, 3, 12)} 位${l >= 8 ? ' · 倒序' : ''}`,
  param: l => ({ n: clamp(2 + l, 3, 12), rev: l >= 8 }),
  async play(level){
    const { n, rev } = GAMES.digits.param(level);
    const seq = [];
    for (let i = 0; i < n; i++){
      let d;
      do { d = rnd(10); } while (i > 0 && d === seq[i - 1]);
      seq.push(d);
    }
    const st = $('#stage');
    st.innerHTML = `<div class="hint" style="margin-bottom:-6px">${rev ? '倒着记' : '记住顺序'}</div>
      <div class="digitwrap"><div class="digit" id="dg"></div></div>`;
    const dg = $('#dg');
    await sleep(650); if (S.quit) throw ABORT;
    for (const d of seq){
      dg.textContent = d;
      await sleep(800); if (S.quit) throw ABORT;
      dg.textContent = '';
      await sleep(200); if (S.quit) throw ABORT;
    }
    const t0 = performance.now();
    const ans = await inputDigits(n, rev);
    if (S.quit) throw ABORT;
    const rt = performance.now() - t0;
    const target = rev ? [...seq].reverse().join('') : seq.join('');
    return { ok: ans === target, rt };
  }
};

function inputDigits(n, rev){
  return new Promise(resolve => {
    const st = $('#stage');
    st.innerHTML = `
      <div class="hint">${rev ? '倒序输入' : '按顺序输入'} · ${n} 位</div>
      <div class="dboxes" id="dboxes">${Array.from({ length: n }, () => '<i></i>').join('')}</div>
      <div class="keypad" id="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-k="${d}">${d}</button>`).join('')}
        <button class="blank" disabled></button>
        <button data-k="0">0</button>
        <button data-k="del" class="del">⌫</button>
      </div>`;
    let buf = '', done = false;
    const boxes = $$('#dboxes i');
    const paint = () => boxes.forEach((b, i) => { b.textContent = buf[i] || ''; });
    const fin = () => { if (done) return; done = true; S.abort = null; resolve(buf); };
    S.abort = () => { if (done) return; done = true; resolve(null); };
    $('#keypad').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled || done) return;
      const k = b.dataset.k;
      if (k === 'del'){ buf = buf.slice(0, -1); paint(); return; }
      if (buf.length >= n) return;
      buf += k; paint(); beep(1200, .03, 'sine');
      if (buf.length === n) setTimeout(fin, 140);
    });
  });
}

/* 6.2 Corsi 积木 */
GAMES.corsi = {
  id: 'corsi', name: 'Corsi 积木', dim: 'spatial', dimName: '空间', icon: '▦',
  total: 12,
  fmt: l => `${clamp(2 + l, 3, 9)} 步 · ${l <= 6 ? '3×3' : '4×4'}`,
  param: l => ({ n: clamp(2 + l, 3, 9), size: l <= 6 ? 3 : 4 }),
  async play(level){
    const { n, size } = GAMES.corsi.param(level);
    const total = size * size;
    const seq = pickUnique(total, n);
    const st = $('#stage');
    st.innerHTML = `<div class="hint">记住亮起的顺序</div>
      <div class="gridbox g${size}" id="cgrid">
        ${Array.from({ length: total }, (_, i) => `<button class="cell" data-i="${i}"></button>`).join('')}
      </div>
      <div class="hint" id="cstep" style="height:16px"></div>`;
    const cells = $$('#cgrid .cell');
    await sleep(600); if (S.quit) throw ABORT;
    for (const i of seq){
      cells[i].classList.add('lit');
      await sleep(600); if (S.quit) throw ABORT;
      cells[i].classList.remove('lit');
      await sleep(200); if (S.quit) throw ABORT;
    }
    const t0 = performance.now();
    let k = 0;
    const res = await new Promise(resolve => {
      let done = false;
      const fin = ok => { if (done) return; done = true; S.abort = null; resolve(ok); };
      S.abort = () => { if (done) return; done = true; resolve(null); };
      $('#cgrid').addEventListener('click', e => {
        const b = e.target.closest('.cell');
        if (!b || done) return;
        const i = +b.dataset.i;
        if (i === seq[k]){
          b.classList.add('hit'); k++;
          if (k === n) fin(true);
        } else {
          b.classList.add('miss');
          cells[seq[k]].classList.add('lit');
          fin(false);
        }
      });
    });
    if (res === null) throw ABORT;
    const rt = performance.now() - t0;
    await sleep(res ? 120 : 700);
    return { ok: res, rt };
  }
};

/* 6.3 图案矩阵 */
GAMES.matrix = {
  id: 'matrix', name: '图案矩阵', dim: 'visual', dimName: '视觉', icon: '▩',
  total: 12,
  fmt: l => { const p = GAMES.matrix.param(l); return `${p.size}×${p.size} · ${p.n} 格`; },
  param: l => ({ n: clamp(2 + l, 3, 12), size: l <= 5 ? 3 : l <= 10 ? 4 : l <= 15 ? 5 : 6 }),
  async play(level){
    const { n, size } = GAMES.matrix.param(level);
    const total = size * size;
    const lit = pickUnique(total, n);
    const dur = Math.max(1500, n * 350);
    const st = $('#stage');
    st.innerHTML = `<div class="hint">记住亮起的格子</div>
      <div class="gridbox g${size}" id="mgrid">
        ${Array.from({ length: total }, (_, i) => `<button class="cell" data-i="${i}"></button>`).join('')}
      </div>
      <div class="row"><button class="btn primary" id="mok" disabled>确定（0/${n}）</button></div>`;
    const cells = $$('#mgrid .cell');
    lit.forEach(i => cells[i].classList.add('lit'));
    await sleep(dur); if (S.quit) throw ABORT;
    lit.forEach(i => cells[i].classList.remove('lit'));

    let sel = new Set();
    const btn = $('#mok');
    const t0 = performance.now();

    const res = await new Promise(resolve => {
      let done = false;
      const fin = () => { if (done) return; done = true; S.abort = null; resolve(true); };
      S.abort = () => { if (done) return; done = true; resolve(null); };
      $('#mgrid').addEventListener('click', e => {
        const b = e.target.closest('.cell');
        if (!b || done) return;
        const i = +b.dataset.i;
        if (sel.has(i)) { sel.delete(i); b.classList.remove('sel'); }
        else if (sel.size < n) { sel.add(i); b.classList.add('sel'); }
        btn.textContent = sel.size === n ? '确定' : `确定（${sel.size}/${n}）`;
        btn.disabled = sel.size !== n;
      });
      btn.onclick = fin;
    });
    if (res === null) throw ABORT;
    const rt = performance.now() - t0;

    const hit = lit.filter(i => sel.has(i));
    const ok = hit.length === n && sel.size === n;
    lit.forEach(i => { if (!sel.has(i)) cells[i].classList.add('miss'); });
    sel.forEach(i => { if (!lit.includes(i)) cells[i].classList.add('miss'); });
    await sleep(ok ? 120 : 800);
    return { ok, rt };
  }
};

/* 6.4 N-back */
const LETTERS = 'BCDFGHJKLMNPQRSTVWXZ'.split('');
GAMES.nback = {
  id: 'nback', name: 'N-back', dim: 'updating', dimName: '更新', icon: '↻',
  total: 20,
  fmt: l => { const p = GAMES.nback.param(l); return `${p.N}-back${p.dual ? ' · 双通道' : ''}`; },
  param: l => ({ N: l <= 5 ? 1 : l <= 12 ? 2 : 3, dual: l > 10 }),
  async play(level){
    const { N, dual } = GAMES.nback.param(level);
    if (!S.cur.nb) S.cur.nb = { items: [] };
    const hist = S.cur.nb.items;
    const i = hist.length;

    let item;
    const isMatch = i >= N && Math.random() < 0.32;
    if (isMatch){
      item = { l: hist[i - N].l, p: hist[i - N].p };
    } else {
      do {
        item = { l: LETTERS[rnd(LETTERS.length)], p: rnd(9) };
      } while (i >= N && item.l === hist[i - N].l && (!dual || item.p === hist[i - N].p));
    }
    hist.push(item);

    const st = $('#stage');
    st.innerHTML = `
      <div class="hint">和 ${N} 步前的${dual ? '字母 + 位置' : '字母'}相同吗？</div>
      ${dual
        ? `<div class="gridbox g3 nbgrid" id="nbg">
             ${Array.from({ length: 9 }, (_, k) => `<div class="cell${k === item.p ? ' lit' : ''}">${k === item.p ? item.l : ''}</div>`).join('')}
           </div>`
        : `<div class="digitwrap"><div class="digit" id="nbL">${item.l}</div></div>`}
      <div class="row2">
        <button class="btn" id="bNo">不同</button>
        <button class="btn primary" id="bYes">相同</button>
      </div>
      <div class="hint" style="opacity:.6">快捷键：F 不同 · J 相同</div>`;

    const t0 = performance.now();
    const ans = await new Promise(resolve => {
      let done = false;
      const fin = v => { if (done) return; done = true; clearTimeout(tm); clearTimeout(hide); S.abort = null; resolve(v); };
      S.abort = () => { if (done) return; done = true; clearTimeout(tm); clearTimeout(hide); resolve(null); };
      const tm = setTimeout(() => fin('none'), 2500);
      const hide = setTimeout(() => {
        if (dual) $$('#nbg .cell').forEach(c => { c.classList.remove('lit'); c.textContent = ''; });
        else if ($('#nbL')) $('#nbL').textContent = '';
      }, 520);
      $('#bYes').onclick = () => fin(true);
      $('#bNo').onclick = () => fin(false);
    });
    if (ans === null) throw ABORT;
    const rt = performance.now() - t0;
    return { ok: ans === isMatch, rt };
  }
};

function showResult(sess, isCal){
  S.cur = null;
  const g = GAMES[sess.game];
  const up = sess.levelEnd > sess.levelStart;
  const dn = sess.levelEnd < sess.levelStart;
  const accN = Math.round(sess.acc * 100);

  $('#v-result').innerHTML = `
    <div class="res">
      <div>
        <div class="cap">${g.name} · ${isCal ? '校准' : '本局得分'}</div>
        <div class="score" style="margin-top:8px">${sess.score}</div>
      </div>
      <div class="stats3">
        <div><b>${accN}%</b><span>正确率</span></div>
        <div><b class="${up ? 'up' : dn ? 'down' : ''}">${sess.levelStart} → ${sess.levelEnd}</b><span>等级</span></div>
        <div><b>${sess.rtMed ? (sess.rtMed / 1000).toFixed(1) + 's' : '—'}</b><span>反应时</span></div>
      </div>
      <div>
        <div class="strip">${sess.trials.map(t =>
          `<i class="${t.ok ? 'ok' : 'bad'}" title="第 ${t.i + 1} 题 · 等级 ${t.lv} · ${t.ok ? '正确' : '错误'}${t.rt ? ' · ' + (t.rt / 1000).toFixed(1) + 's' : ''}"></i>`
        ).join('')}</div>
        <div class="cap" style="margin-top:10px">每格一题，从左到右</div>
      </div>
      <div class="row">
        ${isCal
          ? `<button class="btn primary" id="btnNext">下一步</button>`
          : `<button class="btn" id="btnHome">回首页</button>
             <button class="btn primary" id="btnAgain">再来一局</button>`}
      </div>
    </div>`;

  go('result');
  $('#v-result').classList.add('active');
  if (isCal){
    $('#btnNext').onclick = nextCalibration;
  } else {
    $('#btnHome').onclick = () => { S.cur = null; go('home'); };
    $('#btnAgain').onclick = () => { const id = sess.game; S.cur = null; startSession(id); };
  }
}

function chartSVG(days, list){
  if (list.length < 2) return '<div class="empty">再练几局就能看到曲线</div>';
  const W = 720, H = 230, P = { l: 26, r: 12, t: 12, b: 26 };
  const now = Date.now(), from = now - days * 864e5;
  const x = ts => P.l + ((ts - from) / (now - from)) * (W - P.l - P.r);
  const y = lv => P.t + (1 - (clamp(lv, 1, 20) - 1) / 19) * (H - P.t - P.b);

  let grid = '';
  [1, 5, 10, 15, 20].forEach(lv => {
    grid += `<line x1="${P.l}" y1="${y(lv)}" x2="${W - P.r}" y2="${y(lv)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="4" y="${y(lv) + 3}">${lv}</text>`;
  });
  const fmt = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate(); };
  [from, (from + now) / 2, now].forEach((t, i) => {
    grid += `<text x="${x(t)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${fmt(t)}</text>`;
  });

  let lines = '';
  Object.values(GAMES).forEach(g => {
    const pts = list.filter(s => s.game === g.id);
    if (!pts.length) return;
    if (pts.length === 1){
      lines += `<circle cx="${x(pts[0].ts)}" cy="${y(pts[0].levelEnd)}" r="3.5" fill="${DIM_COLOR[g.id]}"/>`;
    } else {
      const d = pts.map((s, i) => `${i ? 'L' : 'M'}${x(s.ts).toFixed(1)},${y(s.levelEnd).toFixed(1)}`).join(' ');
      lines += `<path d="${d}" fill="none" stroke="${DIM_COLOR[g.id]}" stroke-width="2" stroke-linejoin="round"/>`;
      pts.forEach(s => { lines += `<circle cx="${x(s.ts)}" cy="${y(s.levelEnd)}" r="2.6" fill="${DIM_COLOR[g.id]}"/>`; });
    }
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:190px">${grid}${lines}</svg>`;
}

    </div>

    <div class="card list">
      <button class="row tap" id="expJson"><div><b>导出数据（JSON）</b><span>可导回，用于备份或换设备</span></div><i>›</i></button>
      <button class="row tap" id="expCsv"><div><b>导出数据（CSV）</b><span>每局一行，可用 Excel 打开</span></div><i>›</i></button>
      <button class="row tap" id="impJson"><div><b>导入数据</b><span>会覆盖当前全部记录</span></div><i>›</i></button>
      <button class="row tap danger" id="clearAll"><div><b>清空全部数据</b><span>不可恢复，建议先导出</span></div><i>›</i></button>
    </div>

    <p class="foot">共 ${DB.sessions.length} 局 · 数据量 ${(bytes / 1024).toFixed(1)} KB · 无网络请求</p>
  `;

  $('#goalSeg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    DB.profile.dailyGoal = +b.dataset.n; saveDB(); renderSettings();
  };
  $('#swSound').onclick = () => { DB.profile.sound = !DB.profile.sound; saveDB(); renderSettings(); beep(880); };
  $('#swTheme').onclick = () => {
    DB.profile.theme = DB.profile.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = DB.profile.theme;
    saveDB(); renderSettings();
  };
  $('#swLock').onclick = () => { DB.profile.lock = !DB.profile.lock; saveDB(); renderSettings(); };

  $('#expJson').onclick = () => {
    download('memory-training-' + ymd() + '.json',
      JSON.stringify(DB, null, 2), 'application/json');
  };
  $('#expCsv').onclick = () => {
    const head = 'date,time,game,levelStart,levelEnd,score,accuracy,rtMedianMs,trials\n';
    const rows = DB.sessions.map(s => {
      const d = new Date(s.ts);
      return [ymd(d), d.toTimeString().slice(0, 8), s.game, s.levelStart, s.levelEnd,
              s.score, s.acc, s.rtMed, s.trials.length].join(',');
    }).join('\n');
    download('memory-training-' + ymd() + '.csv', '\ufeff' + head + rows, 'text/csv');
  };
  $('#impJson').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const d = JSON.parse(fr.result);
          if (!d || !Array.isArray(d.sessions)) throw new Error('格式不对');
          if (!confirm(`将导入 ${d.sessions.length} 局记录，覆盖当前数据？`)) return;
          DB = {
            version: 2,
            profile: Object.assign(DB_DEFAULT.profile, d.profile || {}),
            calibration: d.calibration || null,
            sessions: d.sessions,
            streak: Object.assign(DB_DEFAULT.streak, d.streak || {})
          };
          saveDB();
          document.documentElement.dataset.theme = DB.profile.theme;
          renderSettings();
          alert('导入成功');
        } catch (e){ alert('导入失败：' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };
  $('#clearAll').onclick = () => {
    if (!confirm('清空后所有训练记录都会消失，确定？')) return;
    if (!confirm('真的确定？建议先导出备份。')) return;
    localStorage.removeItem(KEY);
    DB = loadDB();
    go('home');
  };
}

function download(name, text, type){
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---------- 11. 键盘操作 ---------- */
document.addEventListener('keydown', e => {
  if (view !== 'play') return;
  const k = e.key;
  if (/^[0-9]$/.test(k)){
    const b = $(`#keypad button[data-k="${k}"]`);
    if (b) { b.click(); e.preventDefault(); }
  } else if (k === 'Backspace'){
    const b = $('#keypad button[data-k="del"]');
    if (b) { b.click(); e.preventDefault(); }
  } else if (k === 'Enter'){
    const b = $('#mok');
    if (b && !b.disabled) { b.click(); e.preventDefault(); }
  } else if (k === 'j' || k === 'J'){
    const b = $('#bYes'); if (b) b.click();
  } else if (k === 'f' || k === 'F'){
    const b = $('#bNo'); if (b) b.click();
  }
});

/* ---------- 12. 启动 ---------- */
document.documentElement.dataset.theme = DB.profile.theme || 'light';
window.addEventListener('beforeunload', () => { if (S.cur) saveDB(); });
go('home');

// 调试用（控制台里可以 __app.DB 看数据）
window.__app = { get DB(){ return DB; }, GAMES, startSession, go };
</script>
</body>
</html>
