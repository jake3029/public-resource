<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数字划消 · 儿童专注力小训练</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --orange: #f97316;
    --orange-dark: #ea580c;
    --blue: #3b82f6;
    --blue-dark: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
  }

  body {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff7ed 0%, #eff6ff 100%);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app { max-width: 760px; margin: 0 auto; padding: 20px 14px 70px; }

  /* ---------- 头部 ---------- */
  .hero { text-align: center; margin-bottom: 20px; }
  .hero h1 {
    font-size: 25px; margin: 0 0 4px; letter-spacing: .5px;
    background: linear-gradient(90deg, var(--orange), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); margin: 0; font-size: 14px; }

  /* ---------- 卡片 ---------- */
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 20px 18px;
    box-shadow: 0 2px 6px rgba(15,23,42,.05), 0 18px 40px -22px rgba(15,23,42,.25);
    margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; color: var(--ink); }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .card-head h2 { margin: 0; }
  .hidden { display: none !important; }

  /* ---------- 模式选择 ---------- */
  .section-label {
    font-size: 13px; font-weight: 700; color: var(--muted);
    margin: 0 0 8px; letter-spacing: .5px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .mode-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 12px 8px 10px;
    border-radius: 16px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: .18s;
    position: relative;
  }
  .mode-btn:hover { border-color: #cbd5e1; transform: translateY(-2px); }
  .mode-btn.active {
    border-color: var(--orange);
    background: #fff7ed;
    box-shadow: 0 0 0 4px rgba(249,115,22,.12);
  }
  .mode-icon { font-size: 22px; line-height: 1.2; }
  .mode-name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .mode-stars { font-size: 11px; color: var(--orange); letter-spacing: 1px; }

  /* ---------- 网格大小 ---------- */
  .size-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .size-btn {
    flex: 1; padding: 12px 6px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px; font-weight: 700; color: var(--muted);
    transition: .15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .size-btn small { font-size: 11px; font-weight: 500; color: #94a3b8; }
  .size-btn:hover { border-color: #cbd5e1; }
  .size-btn.active {
    border-color: var(--blue);
    background: #eff6ff;
    color: var(--blue-dark);
    box-shadow: 0 0 0 4px rgba(59,130,246,.12);
  }
  .size-btn.active small { color: var(--blue); }

  /* ---------- 大按钮 ---------- */
  .big-start {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #fb923c, #f97316 60%, #ea580c);
    color: #fff;
    font-size: 19px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(249,115,22,.55);
    transition: .15s;
  }
  .big-start:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .big-start:active { transform: translateY(1px); }

  .tip-line {
    text-align: center; font-size: 12.5px; color: #94a3b8; margin-top: 12px;
  }

  /* ---------- 训练页 ---------- */
  .train-layout {
    display: flex;
    flex-direction: column;
  }
  /* 竖屏：让左侧容器“透明”，保持原有纵向顺序 */
  .train-side { display: contents; }
  #trainCard .grid-wrap { order: 1; }
  #trainCard .actions    { order: 2; }
  #trainCard .result     { order: 3; }

  .rule-box {
    background: linear-gradient(135deg, #fff7ed, #eff6ff);
    border: 2px dashed #fdba74;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 12px;
    text-align: center;
  }
  .rule-title {
    font-size: 12px; font-weight: 800; color: var(--orange-dark);
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .rule-text {
    font-size: 17px; color: var(--ink); line-height: 1.9;
    font-weight: 600;
  }
  .rule-text .big-num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.7em; height: 1.7em;
    padding: 0 .2em;
    margin: 0 .1em;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--orange), #fb923c);
    color: #fff;
    font-size: 1.05em;
    font-weight: 800;
    box-shadow: 0 3px 0 rgba(234,88,12,.35);
    vertical-align: middle;
    font-family: ui-monospace, monospace;
  }

  .hud {
    display: flex; gap: 10px; justify-content: center; margin-bottom: 6px;
  }
  .hud-item {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 6px 20px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 100px;
  }
  .hud-label { font-size: 11px; color: var(--muted); font-weight: 700; }
  .hud-item b {
    font-size: 22px; color: var(--orange-dark);
    font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 工具选择 ---------- */
  .tools {
    display: flex; gap: 10px; justify-content: center;
    margin: 14px 0 4px; flex-wrap: wrap;
  }
  .tool {
    padding: 9px 22px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-size: 15px; font-weight: 700;
    color: var(--muted);
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
    transition: .15s;
  }
  .tool:hover { border-color: #cbd5e1; }
  .tool.active {
    border-color: var(--blue);
    background: #eff6ff;
    color: var(--blue-dark);
    box-shadow: 0 0 0 4px rgba(59,130,246,.13);
    transform: scale(1.03);
  }
  .tool .sym {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; font-size: 17px;
  }
  .sym-circle { color: var(--blue); }
  .sym-x { color: var(--red); }

  .hint {
    text-align: center; font-size: 12.5px; color: #94a3b8;
    margin: 4px 0 10px;
  }

  /* ---------- 网格 ---------- */
  .grid-wrap { padding: 4px 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 5), 1fr);
    gap: 7px;
    width: min(100%, 520px);
    margin: 0 auto;
    user-select: none;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2.5px solid #dbeafe;
    background: #fff;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--num-size, 24px);
    font-weight: 800;
    color: #1e3a8a;
    cursor: pointer;
    padding: 0;
    font-family: ui-rounded, ui-monospace, "SF Pro Rounded", monospace;
    line-height: 1;
    transition: background .12s, border-color .12s, transform .08s, box-shadow .12s;
    box-shadow: 0 2px 0 #e2e8f0;
  }
  .cell:hover { background: #f0f9ff; border-color: #93c5fd; }
  .cell:active { transform: scale(.94); }
  .cell .num { pointer-events: none; }

  .mark {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .mark-x {
    font-size: calc(var(--num-size, 24px) * 1.4);
    color: var(--red); font-weight: 900; line-height: 1;
  }
  .mark-circle {
    inset: 12%;
    border: 3.5px solid var(--blue);
    border-radius: 50%;
  }

  /* 判定反馈 */
  .cell.fb-ok {
    border-color: var(--green);
    background: #f0fdf4;
    animation: popOk .35s ease;
  }
  .cell.fb-miss {
    border-color: var(--yellow);
    background: #fffbeb;
    box-shadow: 0 0 0 3px rgba(245,158,11,.28);
    animation: blinkMiss .7s ease 2;
  }
  .cell.fb-fp {
    border-color: var(--red);
    background: #fef2f2;
    box-shadow: 0 0 0 3px rgba(239,68,68,.22);
    animation: shake .35s ease;
  }
  @keyframes popOk {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes blinkMiss {
    0%, 100% { background: #fffbeb; }
    50% { background: #fef3c7; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* ---------- 操作按钮 ---------- */
  .actions {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 18px; flex-wrap: wrap;
  }
  .btn {
    padding: 11px 24px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    color: #475569;
    font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: .15s;
  }
  .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn.primary {
    background: linear-gradient(135deg, #fb923c, #f97316);
    border: none;
    color: #fff;
    box-shadow: 0 6px 16px -5px rgba(249,115,22,.6);
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
  .btn.small { padding: 7px 16px; font-size: 13px; }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: #fef2f2; }
  .btn.ghost { border-color: transparent; background: transparent; color: #94a3b8; }

  /* ---------- 结果 ---------- */
  .result {
    margin-top: 22px;
    border-top: 2px dashed var(--line);
    padding-top: 20px;
    animation: fadeUp .4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-head { text-align: center; margin-bottom: 16px; }
  .stars-big {
    font-size: 46px; letter-spacing: 6px; line-height: 1.1;
    margin-bottom: 4px;
  }
  .star-on { color: #fbbf24; text-shadow: 0 2px 8px rgba(251,191,36,.5); }
  .star-off { color: #e2e8f0; }
  .praise {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(90deg, var(--orange), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin: 14px 0 10px;
  }
  .res-item {
    background: #f8fafc;
    border-radius: 14px;
    padding: 10px;
    display: flex; flex-direction: column; align-items: center;
  }
  .res-item span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .res-item b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .res-item.good b { color: var(--green); }
  .res-item.miss b { color: var(--yellow); }
  .res-item.bad b { color: var(--red); }
  .res-item.time b { color: var(--blue-dark); }

  .legend {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .legend i {
    display: inline-block; width: 12px; height: 12px;
    border-radius: 4px; margin-right: 4px; vertical-align: -1px;
  }

  /* ---------- 记录 ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: #f8fafc;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; flex-direction: column;
  }
  .stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ink); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
  th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--muted); font-weight: 700; font-size: 12px;
    background: #f8fafc;
  }
  thead th:first-child { border-radius: 10px 0 0 10px; }
  thead th:last-child { border-radius: 0 10px 10px 0; }
  tbody tr:hover { background: #f8fafc; }
  .empty { text-align: center; color: #94a3b8; padding: 24px 0; font-size: 14px; }
  .stars-cell { font-size: 14px; letter-spacing: 1px; color: #fbbf24; }
  .stars-cell .off { color: #e2e8f0; }

  @media (max-width: 520px) {
    .app { padding: 14px 10px 60px; }
    .hero h1 { font-size: 21px; }
    .card { padding: 16px 13px; border-radius: 20px; }
    .mode-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .mode-btn { padding: 10px 4px 8px; }
    .mode-icon { font-size: 19px; }
    .mode-name { font-size: 12.5px; }
    .grid { gap: 6px; }
    .cell { border-radius: 11px; }
    .rule-text { font-size: 15px; }
    .hud-item { min-width: 84px; padding: 5px 14px; }
    .hud-item b { font-size: 19px; }
    .stars-big { font-size: 38px; }
    .result-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* =========================================================
   * 平板横屏优化：屏幕矮、宽度富余
   * 训练页改为「左侧控制区 + 右侧棋盘」，棋盘高度贴合视口
   * ======================================================= */
  @media (orientation: landscape) and (min-width: 700px) {
    .app {
      max-width: 1120px;
      padding: 10px 16px 22px;
    }

    .hero { margin-bottom: 12px; }
    .hero h1 { font-size: 22px; }
    .hero p { font-size: 13px; }
    /* 训练中隐藏页头，把竖直空间都留给棋盘 */
    body.training .hero { display: none; }

    .card {
      padding: 14px 18px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    /* ---- 设置页：更紧凑 ---- */
    .section-label { margin-bottom: 6px; }
    .mode-grid { gap: 8px; margin-bottom: 12px; }
    .mode-btn { padding: 10px 6px 8px; }
    .mode-icon { font-size: 20px; }
    .size-row { margin-bottom: 12px; }
    .size-btn { padding: 10px 6px; }
    .big-start { padding: 13px; font-size: 18px; }
    .tip-line { margin-top: 8px; }

    /* ---- 训练页：左右分栏 ---- */
    #trainCard { padding: 14px 18px; }

    .train-layout {
      display: grid;
      grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
      gap: 12px 20px;
      align-items: stretch;
    }
    .train-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .rule-box { margin-bottom: 0; padding: 10px 12px; }
    .rule-title { font-size: 11px; letter-spacing: 1.5px; }
    .rule-text { font-size: 15px; line-height: 1.7; }

    .hud { margin-bottom: 0; gap: 8px; }
    .hud-item { padding: 4px 12px; min-width: 84px; }
    .hud-item b { font-size: 19px; }

    .tools { margin: 0; gap: 8px; justify-content: flex-start; }
    .tool { padding: 7px 14px; font-size: 13.5px; }
    .tool .sym { width: 20px; height: 20px; font-size: 15px; }

    .hint { margin: 0; font-size: 12px; text-align: left; }

    .train-side .actions {
      margin: auto 0 0;       /* 推到左栏底部 */
      gap: 8px;
      justify-content: flex-start;
    }
    .train-side .btn { padding: 9px 16px; font-size: 14px; }

    /* 棋盘：宽度同时受「可用宽度」与「视口高度」约束 */
    .grid-wrap {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      min-width: 0;
    }
    .grid {
      width: min(100%, calc(100vh - 96px), 560px);
      width: min(100%, calc(100dvh - 96px), 560px);
      max-width: 560px;
      margin: 0;
    }

    /* 结果：横跨两栏放在底部，提交后自动滚动到此处 */
    #trainCard .result {
      grid-column: 1 / -1;
      margin-top: 6px;
      padding-top: 14px;
    }
    .result-head { margin-bottom: 10px; }
    .stars-big { font-size: 38px; }
    .result-grid { margin: 10px 0 8px; }

    /* ---- 记录页 ---- */
    .stats { gap: 8px; margin-bottom: 12px; }
    .stat { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <h1>🌈 数字划消 · 专注力小训练</h1>
    <p>找一找，点一点，看谁找得又快又准！</p>
  </header>

  <!-- ================= 设置页 ================= -->
  <section class="card" id="setupCard">

    <p class="section-label">① 选一种玩法</p>
    <div class="mode-grid" id="modeGrid">
      <button class="mode-btn active" data-mode="findOne">
        <span class="mode-icon">🔍</span>
        <span class="mode-name">找一个数字</span>
        <span class="mode-stars">★</span>
      </button>
      <button class="mode-btn" data-mode="findTwo">
        <span class="mode-icon">🔎</span>
        <span class="mode-name">找两个数字</span>
        <span class="mode-stars">★★</span>
      </button>
      <button class="mode-btn" data-mode="twoMarks">
        <span class="mode-icon">✏️</span>
        <span class="mode-name">两个小任务</span>
        <span class="mode-stars">★★</span>
      </button>
      <button class="mode-btn" data-mode="neighbor">
        <span class="mode-icon">➡️</span>
        <span class="mode-name">找邻居</span>
        <span class="mode-stars">★★★</span>
      </button>
      <button class="mode-btn" data-mode="twins">
        <span class="mode-icon">👯</span>
        <span class="mode-name">找双胞胎</span>
        <span class="mode-stars">★★★</span>
      </button>
      <button class="mode-btn" data-mode="random">
        <span class="mode-icon">🎲</span>
        <span class="mode-name">随机惊喜</span>
        <span class="mode-stars">★~★★★</span>
      </button>
    </div>

    <p class="section-label">② 选一张数字卡片</p>
    <div class="size-row" id="sizeRow">
      <button class="size-btn" data-size="4">
        小卡片<small>4 × 4</small>
      </button>
      <button class="size-btn active" data-size="5">
        中卡片<small>5 × 5</small>
      </button>
      <button class="size-btn" data-size="6">
        大卡片<small>6 × 6</small>
      </button>
    </div>

    <button class="big-start" id="startBtn">开始找数字 🚀</button>
    <p class="tip-line">💡 建议每次玩 5～10 分钟，玩完休息一下眼睛</p>
  </section>

  <!-- ================= 训练页 ================= -->
  <section class="card hidden" id="trainCard">
    <div class="train-layout">

      <!-- 左侧控制区（竖屏时自动展开为纵向顺序） -->
      <div class="train-side">
        <div class="rule-box">
          <div class="rule-title" id="taskTitle">小任务</div>
          <div class="rule-text" id="ruleText"></div>
        </div>

        <div class="hud">
          <div class="hud-item">
            <span class="hud-label">已标记</span>
            <b id="markCount">0</b>
          </div>
        </div>

        <div class="tools" id="tools"></div>
        <div class="hint">点一下格子做标记，再点一下可以取消</div>

        <div class="actions">
          <button class="btn primary" id="submitBtn">看看我找得对不对</button>
          <button class="btn" id="restartBtn">换一题</button>
          <button class="btn ghost" id="quitBtn">返回</button>
        </div>
      </div>

      <!-- 右侧棋盘 -->
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>

      <!-- 判定结果 -->
      <div class="result hidden" id="result"></div>
    </div>
  </section>

  <!-- ================= 记录页 ================= -->
  <section class="card">
    <div class="card-head">
      <h2>📒 成长记录</h2>
      <div>
        <button class="btn small" id="exportBtn">导出</button>
        <button class="btn small danger" id="clearBtn">清空</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th><th>玩法</th><th>用时</th><th>星星</th>
            <th>找对</th><th>漏掉</th><th>点错</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量
     ========================================================= */
  const STORAGE_KEY = 'digit_cancel_kids_v1';
  const MAX_RECORDS = 500;
  const NUM_MIN = 1;
  const NUM_MAX = 6;      // 6 岁孩子认 1~6 足够

  const TOOL_DEF = {
    circle: { sym: '○', label: '圈起来', cls: 'mark-circle' },
    x:      { sym: '✕', label: '划掉',   cls: 'mark-x' }
  };

  /* =========================================================
     工具函数
     ========================================================= */
  const rndInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeGrid(rows, cols) {
    const g = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push({ v: rndInt(NUM_MIN, NUM_MAX), mark: null, exp: null });
      }
      g.push(row);
    }
    return g;
  }

  function clearExp(grid) {
    for (const row of grid) for (const cell of row) cell.exp = null;
  }

  function countTargets(grid) {
    let n = 0;
    for (const row of grid) for (const cell of row) if (cell.exp) n++;
    return n;
  }

  function fmtTime(ms) {
    const total = Math.round(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* =========================================================
     音效（Web Audio，无需外部文件）
     ========================================================= */
  let audioCtx = null;
  let soundOn = true;

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function tone(freq, dur, type, vol, delay) {
    if (!audioCtx || !soundOn) return;
    try {
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  const sfx = {
    tap:   () => tone(760, 0.07, 'sine', 0.07),
    untap: () => tone(500, 0.06, 'sine', 0.05),
    ok:    () => { tone(880, 0.1, 'sine', 0.1); tone(1175, 0.16, 'sine', 0.1, 0.09); },
    perfect: () => {
      tone(784, 0.12, 'sine', 0.11);
      tone(988, 0.12, 'sine', 0.11, 0.12);
      tone(1319, 0.22, 'sine', 0.11, 0.24);
    },
    bad:   () => tone(220, 0.18, 'triangle', 0.06)
  };

  /* =========================================================
     规则生成器（5 种儿童版玩法）
     ========================================================= */

  // 1️⃣ 找一个数字
  function buildFindOne() {
    const t = rndInt(NUM_MIN, NUM_MAX);
    return {
      key: 'findOne',
      title: '找一个数字',
      ruleHtml: `把所有的 <span class="big-num">${t}</span> 圈起来`,
      tools: ['circle'],
      apply(grid) {
        clearExp(grid);
        for (const row of grid) for (const cell of row) {
          if (cell.v === t) cell.exp = 'circle';
        }
      }
    };
  }

  // 2️⃣ 找两个数字（同一种标记）
  function buildFindTwo() {
    const vals = shuffle(
      Array.from({ length: NUM_MAX - NUM_MIN + 1 }, (_, i) => NUM_MIN + i)
    ).slice(0, 2);
    const a = vals[0], b = vals[1];
    return {
      key: 'findTwo',
      title: '找两个数字',
      ruleHtml:
        `把所有的 <span class="big-num">${a}</span> 和 ` +
        `<span class="big-num">${b}</span> 都圈起来`,
      tools: ['circle'],
      apply(grid) {
        clearExp(grid);
        for (const row of grid) for (const cell of row) {
          if (cell.v === a || cell.v === b) cell.exp = 'circle';
        }
      }
    };
  }

  // 3️⃣ 两个小任务（两种标记）
  function buildTwoMarks() {
    const vals = shuffle(
      Array.from({ length: NUM_MAX - NUM_MIN + 1 }, (_, i) => NUM_MIN + i)
    ).slice(0, 2);
    const a = vals[0], b = vals[1];
    return {
      key: 'twoMarks',
      title: '两个小任务',
      ruleHtml:
        `圈出所有的 <span class="big-num">${a}</span>，` +
        `划掉所有的 <span class="big-num">${b}</span>`,
      tools: ['circle', 'x'],
      defaultTool: 'circle',
      apply(grid) {
        clearExp(grid);
        for (const row of grid) for (const cell of row) {
          if (cell.v === a) cell.exp = 'circle';
          else if (cell.v === b) cell.exp = 'x';
        }
      }
    };
  }

  // 4️⃣ 找邻居：划掉紧挨在某数字右边的那个
  function buildNeighbor() {
    const t = rndInt(NUM_MIN, NUM_MAX);
    return {
      key: 'neighbor',
      title: '找邻居',
      ruleHtml:
        `划掉紧挨在 <span class="big-num">${t}</span> ` +
        `<b style="color:#ea580c">右边</b> 的那个数字`,
      tools: ['x'],
      apply(grid) {
        clearExp(grid);
        for (const row of grid) {
          for (let i = 0; i < row.length - 1; i++) {
            if (row[i].v === t) row[i + 1].exp = 'x';
          }
        }
      }
    };
  }

  // 5️⃣ 找双胞胎：左右相邻且相同
  function buildTwins() {
    return {
      key: 'twins',
      title: '找双胞胎',
      ruleHtml: `把左右挨着、长得一样的两个数字都圈起来`,
      tools: ['circle'],
      apply(grid) {
        clearExp(grid);
        for (const row of grid) {
          for (let i = 0; i < row.length - 1; i++) {
            if (row[i].v === row[i + 1].v) {
              row[i].exp = 'circle';
              row[i + 1].exp = 'circle';
            }
          }
        }
      }
    };
  }

  const BUILDERS = [buildFindOne, buildFindTwo, buildTwoMarks, buildNeighbor, buildTwins];

  const MODE_MAP = {
    findOne:   buildFindOne,
    findTwo:   buildFindTwo,
    twoMarks:  buildTwoMarks,
    neighbor:  buildNeighbor,
    twins:     buildTwins
  };

  /* =========================================================
     生成任务
     ========================================================= */
  function createTask(modeKey, rows, cols) {
    const pool = (modeKey === 'random') ? BUILDERS : [MODE_MAP[modeKey]];
    const area = rows * cols;
    const minT = Math.max(2, Math.floor(area * 0.06));
    const maxT = Math.floor(area * 0.55);

    let last = null;
    for (let attempt = 0; attempt < 500; attempt++) {
      const spec = pool[rndInt(0, pool.length - 1)]();
      const grid = makeGrid(rows, cols);
      spec.apply(grid);
      const targets = countTargets(grid);
      last = { spec, grid, targets };
      if (targets >= minT && targets <= maxT) return last;
    }
    return last;
  }

  /* =========================================================
     DOM
     ========================================================= */
  const $ = id => document.getElementById(id);

  const setupCard  = $('setupCard');
  const trainCard  = $('trainCard');
  const modeGrid   = $('modeGrid');
  const sizeRow    = $('sizeRow');
  const startBtn   = $('startBtn');

  const taskTitle  = $('taskTitle');
  const ruleText   = $('ruleText');
  const markCountEl = $('markCount');

  const toolsEl    = $('tools');
  const gridEl     = $('grid');
  const submitBtn  = $('submitBtn');
  const restartBtn = $('restartBtn');
  const quitBtn    = $('quitBtn');
  const resultEl   = $('result');

  const statsEl     = $('stats');
  const historyBody = $('historyBody');
  const exportBtn   = $('exportBtn');
  const clearBtn    = $('clearBtn');

  /* =========================================================
     状态
     ========================================================= */
  let state = null;         // { spec, grid, rows, cols, targets, currentTool, startTime, finished }
  let selectedMode = 'findOne';
  let selectedSize = 5;

  /* =========================================================
     设置页交互
     ========================================================= */
  modeGrid.addEventListener('click', e => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    selectedMode = btn.dataset.mode;
    modeGrid.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
    tone(600, 0.05, 'sine', 0.04);
  });

  sizeRow.addEventListener('click', e => {
    const btn = e.target.closest('.size-btn');
    if (!btn) return;
    selectedSize = +btn.dataset.size;
    sizeRow.querySelectorAll('.size-btn').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
    tone(600, 0.05, 'sine', 0.04);
  });

  /* =========================================================
     渲染
     ========================================================= */
  function renderTools() {
    const tools = state.spec.tools;
    toolsEl.innerHTML = '';
    if (tools.length <= 1) {
      toolsEl.style.display = 'none';
      return;
    }
    toolsEl.style.display = 'flex';
    tools.forEach(t => {
      const def = TOOL_DEF[t];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool' + (t === state.currentTool ? ' active' : '');
      btn.dataset.tool = t;
      btn.innerHTML =
        `<span class="sym sym-${t}">${def.sym}</span>` +
        `<span>${def.label}</span>`;
      btn.addEventListener('click', () => {
        if (state.finished) return;
        state.currentTool = t;
        toolsEl.querySelectorAll('.tool').forEach(b => {
          b.classList.toggle('active', b.dataset.tool === t);
        });
        tone(700, 0.06, 'sine', 0.05);
      });
      toolsEl.appendChild(btn);
    });
  }

  function renderGrid() {
    gridEl.style.setProperty('--cols', state.cols);
    gridEl.innerHTML = '';
    const frag = document.createDocumentFragment();

    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const cell = state.grid[r][c];
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;
        el.setAttribute('aria-label', `第${r + 1}行第${c + 1}列，数字${cell.v}`);
        el.innerHTML = `<span class="num">${cell.v}</span><span class="mark"></span>`;
        el.addEventListener('click', () => onCellClick(r, c, el));
        frag.appendChild(el);
      }
    }
    gridEl.appendChild(frag);
    requestAnimationFrame(sizeNumbers);
    // 横屏布局刚切换时，rAF 可能取不到最终宽度，再补一次
    setTimeout(sizeNumbers, 120);
  }

  function sizeNumbers() {
    const first = gridEl.querySelector('.cell');
    if (!first) return;
    const w = first.getBoundingClientRect().width;
    if (w > 0) {
      gridEl.style.setProperty('--num-size', Math.max(12, w * 0.46) + 'px');
    }
  }

  function paintCell(el, cell) {
    const m = el.querySelector('.mark');
    m.className = 'mark';
    m.textContent = '';
    if (!cell.mark) return;
    if (cell.mark === 'circle') {
      m.classList.add('mark-circle');
    } else if (cell.mark === 'x') {
      m.classList.add('mark-x');
      m.textContent = '✕';
    }
  }

  function onCellClick(r, c, el) {
    if (!state || state.finished) return;
    const cell = state.grid[r][c];
    if (cell.mark === state.currentTool) {
      cell.mark = null;
      sfx.untap();
    } else {
      cell.mark = state.currentTool;
      sfx.tap();
    }
    paintCell(el, cell);
    updateMarkCount();
  }

  function updateMarkCount() {
    let n = 0;
    for (const row of state.grid) for (const cell of row) if (cell.mark) n++;
    markCountEl.textContent = n;
  }

  /* =========================================================
     开始 / 重置
     ========================================================= */
  function startNewTask() {
    initAudio();

    const rows = selectedSize;
    const cols = selectedSize;
    const task = createTask(selectedMode, rows, cols);

    state = {
      spec: task.spec,
      grid: task.grid,
      rows,
      cols,
      targets: task.targets,
      currentTool: task.spec.defaultTool || task.spec.tools[0],
      startTime: Date.now(),
      finished: false
    };

    setupCard.classList.add('hidden');
    trainCard.classList.remove('hidden');
    // 训练中隐藏页头（横屏下省出棋盘高度）
    document.body.classList.add('training');

    resultEl.classList.add('hidden');
    resultEl.innerHTML = '';
    submitBtn.disabled = false;
    restartBtn.textContent = '换一题';

    taskTitle.textContent = '🌟 ' + state.spec.title;
    ruleText.innerHTML = state.spec.ruleHtml;
    markCountEl.textContent = '0';

    renderTools();
    renderGrid();

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* =========================================================
     判定
     ========================================================= */
  function evaluate(durationMs) {
    let hit = 0, miss = 0, fp = 0, wrong = 0;

    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        const cell = state.grid[r][c];
        const hasExp = !!cell.exp;
        const hasMark = !!cell.mark;

        if (hasExp && hasMark && cell.exp === cell.mark) hit++;
        else if (hasExp && !hasMark) miss++;
        else if (!hasExp && hasMark) fp++;
        else if (hasExp && hasMark && cell.exp !== cell.mark) wrong++;
      }
    }

    const totalTargets = hit + miss + wrong;   // 应有目标总数
    const precision = hit / Math.max(1, hit + fp + wrong);
    const recall = hit / Math.max(1, totalTargets);
    const f1 = (precision + recall) > 0
      ? (2 * precision * recall) / (precision + recall)
      : 0;

    const score = Math.round(f1 * 100);
    const stars = score >= 85 ? 3 : score >= 60 ? 2 : 1;

    return {
      ts: Date.now(),
      mode: state.spec.key,
      modeTitle: state.spec.title,
      ruleText: ruleText.textContent.trim(),
      rows: state.rows,
      cols: state.cols,
      durationMs,
      targets: totalTargets,
      hit,
      miss,
      fp: fp + wrong,      // 儿童版把"符号用错"也归入"点错了"
      wrong,
      score,
      stars
    };
  }

  function markFeedback() {
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(el => {
      const r = +el.dataset.r;
      const c = +el.dataset.c;
      const cell = state.grid[r][c];
      el.classList.remove('fb-ok', 'fb-miss', 'fb-fp');

      const hasExp = !!cell.exp;
      const hasMark = !!cell.mark;

      if (hasExp && hasMark && cell.exp === cell.mark) el.classList.add('fb-ok');
      else if (hasExp && !hasMark) el.classList.add('fb-miss');
      else if (!hasExp && hasMark) el.classList.add('fb-fp');
      else if (hasExp && hasMark) el.classList.add('fb-fp');
    });
  }

  function praiseOf(stars) {
    if (stars === 3) {
      return ['太棒啦！你是专注小达人！', '好厉害！眼睛真亮！', '完美！找得又快又准！'][rndInt(0, 2)];
    }
    if (stars === 2) {
      return ['做得不错！再试一次会更棒！', '很认真！继续加油！', '不错哦，快找到全部啦！'][rndInt(0, 2)];
    }
    return ['慢慢来，不着急，你已经很棒了！', '认真找，下一次会更好！', '别灰心，再试一次吧！'][rndInt(0, 2)];
  }

  function starsHtml(n, big) {
    let s = '';
    for (let i = 0; i < 3; i++) {
      s += `<span class="${i < n ? 'star-on' : 'star-off'}">★</span>`;
    }
    return s;
  }

  function showResult(res) {
    const praise = praiseOf(res.stars);
    resultEl.classList.remove('hidden');
    resultEl.innerHTML = `
      <div class="result-head">
        <div class="stars-big">${starsHtml(res.stars, true)}</div>
        <div class="praise">${praise}</div>
      </div>
      <div class="result-grid">
        <div class="res-item good"><span>找对了</span><b>${res.hit} 个</b></div>
        <div class="res-item miss"><span>漏掉了</span><b>${res.miss} 个</b></div>
        <div class="res-item bad"><span>点错了</span><b>${res.fp} 个</b></div>
        <div class="res-item time"><span>用时</span><b>${fmtTime(res.durationMs)}</b></div>
      </div>
      <div class="legend">
        <span><i style="background:#22c55e"></i>找对啦</span>
        <span><i style="background:#f59e0b"></i>漏掉了</span>
        <span><i style="background:#ef4444"></i>点错了</span>
      </div>
    `;
    setTimeout(() => {
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 80);
  }

  function submit() {
    if (!state || state.finished) return;
    state.finished = true;

    const duration = Date.now() - state.startTime;
    const res = evaluate(duration);

    markFeedback();
    showResult(res);
    saveRecord(res);

    if (res.stars === 3) sfx.perfect();
    else if (res.stars === 2) sfx.ok();
    else sfx.bad();

    submitBtn.disabled = true;
    restartBtn.textContent = '下一题';
  }

  /* =========================================================
     localStorage
     ========================================================= */
  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecord(rec) {
    try {
      const list = loadRecords();
      list.unshift(rec);
      if (list.length > MAX_RECORDS) list.length = MAX_RECORDS;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      console.warn('保存记录失败：', e);
    }
    renderHistory();
  }

  function renderHistory() {
    const list = loadRecords();

    // 统计
    if (list.length === 0) {
      statsEl.innerHTML = `<div class="stat"><span>累计训练</span><b>0 次</b></div>`;
    } else {
      const total = list.length;
      const avgStars = (list.reduce((s, r) => s + (r.stars || 0), 0) / total).toFixed(1);
      const bestStars = Math.max.apply(null, list.map(r => r.stars || 0));
      const today = new Date().toDateString();
      const todayCount = list.filter(r => new Date(r.ts).toDateString() === today).length;

      statsEl.innerHTML = `
        <div class="stat"><span>累计训练</span><b>${total} 次</b></div>
        <div class="stat"><span>今日训练</span><b>${todayCount} 次</b></div>
        <div class="stat"><span>平均星星</span><b>${avgStars} ⭐</b></div>
        <div class="stat"><span>最高星星</span><b>${bestStars} ⭐</b></div>
      `;
    }

    // 表格
    if (list.length === 0) {
      historyBody.innerHTML =
        `<tr><td colspan="7" class="empty">还没有记录，先来玩一次吧 👆</td></tr>`;
      return;
    }

    historyBody.innerHTML = list.slice(0, 30).map(r => {
      const d = new Date(r.ts);
      const time = `${d.getMonth() + 1}/${d.getDate()} ` +
                   `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      const starsHtmlCell = (() => {
        let s = '';
        for (let i = 0; i < 3; i++) {
          s += i < (r.stars || 0) ? '★' : '<span class="off">★</span>';
        }
        return s;
      })();
      return `<tr>
        <td>${time}</td>
        <td>${r.modeTitle}</td>
        <td>${fmtTime(r.durationMs)}</td>
        <td class="stars-cell">${starsHtmlCell}</td>
        <td>${r.hit}</td>
        <td>${r.miss}</td>
        <td>${r.fp}</td>
      </tr>`;
    }).join('');
  }

  function exportRecords() {
    const list = loadRecords();
    if (list.length === 0) {
      alert('还没有记录可以导出哦～');
      return;
    }
    const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'kids-digit-cancel-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function clearRecords() {
    if (!confirm('确定要清空所有训练记录吗？清空后就找不回来啦。')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  }

  /* =========================================================
     事件绑定
     ========================================================= */
  startBtn.addEventListener('click', startNewTask);
  submitBtn.addEventListener('click', submit);
  restartBtn.addEventListener('click', startNewTask);

  quitBtn.addEventListener('click', () => {
    state = null;
    trainCard.classList.add('hidden');
    setupCard.classList.remove('hidden');
    document.body.classList.remove('training');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  exportBtn.addEventListener('click', exportRecords);
  clearBtn.addEventListener('click', clearRecords);

  window.addEventListener('resize', () => {
    if (state && !trainCard.classList.contains('hidden')) {
      requestAnimationFrame(sizeNumbers);
    }
  });

  // 横竖屏切换后，等布局稳定再量一次格子宽度
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (state && !trainCard.classList.contains('hidden')) sizeNumbers();
    }, 250);
  });

  window.addEventListener('beforeunload', e => {
    if (state && !state.finished && !trainCard.classList.contains('hidden')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* =========================================================
     初始化
     ========================================================= */
  renderHistory();

})();
</script>
</body>
</html>
